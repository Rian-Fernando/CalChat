name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      # No env vars are set here on purpose: lib/redis.ts falls back to an
      # in-memory store when Upstash isn't configured, so the build exercises
      # the same code path a fresh clone would.
      - name: Build
        run: npm run build
